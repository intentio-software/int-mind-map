[package]
name = "int-mindmap-mcp"
description = "MCP server exposing Intentio Mind Map files to AI agents over stdio."
version = "1.9.0"
edition = "2021"
authors = ["Intentio Software"]
license = "MIT"

[[bin]]
name = "int-mindmap-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
